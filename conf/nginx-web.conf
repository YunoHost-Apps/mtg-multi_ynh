# MTG-Multi WEB proxy Nginx configuration for YunoHost
#
# Terminates TLS for __WEB_DOMAIN__ and forwards WEB proxy / decoy requests to
# mtg-multi's loopback HTTP listener.

location / {
  # Keep the bridge capability query string out of nginx access logs and match
  # mtg-multi's unversioned nginx decoy error pages.
  access_log off;
  server_tokens off;

  # Strip YunoHost's server-level framing/SSO headers so mtg-multi's own bridge
  # sandbox CSP and nginx-identical decoy responses pass through untouched.
  more_clear_headers "X-Frame-Options";
  more_clear_headers "X-XSS-Protection";
  more_clear_headers "X-Download-Options";
  more_clear_headers "X-Permitted-Cross-Domain-Policies";
  more_clear_headers "X-SSO-WAT";

  # mtg-multi requires X-Forwarded-For to hold a single client IP ($remote_addr),
  # never a client-supplied chain. Clearing any incoming header makes
  # proxy_params_no_auth's $proxy_add_x_forwarded_for evaluate to $remote_addr.
  more_clear_input_headers "X-Forwarded-For";
  include proxy_params_no_auth;

  proxy_buffering off;
  proxy_read_timeout 60s;
  client_max_body_size 32m;
  proxy_pass http://127.0.0.1:__PORT_WEB__;
}

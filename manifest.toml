#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2
id = "mtg-multi"
name = "mtg-multi"
description.en = "Fork of mtg with multi-secret support and per-user stats"
description.fr = "Fork de mtg avec support multi-secret et statistiques par utilisateur"

version = "1.15.0~ynh2"

maintainers = ["mrpsycho"]

[upstream]
license = "MIT"
code = "https://github.com/dolonet/mtg-multi"
admindoc = "https://github.com/dolonet/mtg-multi/blob/master/README.md"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false

# Users don't log in *into* mtg with their YunoHost credentials...
ldap = false
# ...but the personal page showing their own secret is behind the YunoHost SSO.
sso = true

ram.build = "50M"
ram.runtime = "50M"
disk = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/mtg-multi"

    [install.init_main_permission]
    type = "group"
    default = "all_users"

    [install.port]
    type = "number"
    ask.en = "Choose a port for the proxy to bind to"
    ask.fr = "Choisissez un port auquel le proxy doit se connecter"
    default = 3128
    # Explicit bounds are mandatory: the webadmin turns an absent max into a
    # `null` one and then rejects every value. 1024 is the floor because the
    # service runs unprivileged.
    min = 1024
    max = 65535

    [install.dns]
    type = "string"
    ask.en = "Enter the DNS resolver IP"
    ask.fr = "Saisissez l'adresse IP du résolveur DNS"
    default = "1.1.1.1"

    [install.frontend_domain]
    type = "string"
    ask.en = "Domain to use for domain fronting, used to generate every user's secret"
    ask.fr = "Domaine à utiliser pour le domain fronting, utilisé pour générer le secret de chaque utilisateur"
    default = "storage.googleapis.com"

    [install.prometheus]
    type = "boolean"
    ask.en = "Enable Prometheus metrics?"
    ask.fr = "Activer les métriques Prometheus ?"
    default = false

    [install.web]
    type = "boolean"
    ask.en = "Enable WEB proxy mode (MTProto over HTTPS for Telegram Desktop)?"
    ask.fr = "Activer le mode proxy WEB (MTProto sur HTTPS pour Telegram Desktop) ?"
    default = false

    [install.web_domain]
    type = "domain"
    ask.en = "Domain for the WEB proxy (cannot share '/' with another app)"
    ask.fr = "Domaine pour le proxy WEB (ne peut pas partager « / » avec une autre application)"
    optional = true
    visible = "web == true"

[resources]
    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
        [resources.permissions.main]
        url = "/"

        [resources.permissions.web]
        show_tile = false
        auth_header = false
        allowed = "visitors"
        protected = true

    [resources.apt]
    packages = "php8.2-fpm"

    [resources.ports]
        # The proxy port must be reachable from the internet (MTProto is TCP-only)
        [resources.ports.main]
        default = 3128
        exposed = "TCP"

        # Stats API, Prometheus exporter and optional WEB backend stay on loopback
        [resources.ports.api]
        default = 9090

        [resources.ports.prometheus]
        default = 3129

        [resources.ports.web]
        default = 18080

    [resources.sources.main]
    # x86_64 / amd64
    amd64.url = "https://github.com/dolonet/mtg-multi/releases/download/v1.15.0/mtg-multi-1.15.0-linux-amd64.tar.gz"
    amd64.sha256 = "32488c3764db36f047935cfa677dc1433305326b67f6147a29195b8a84cfc540"
    # arm64 / aarch64
    arm64.url = "https://github.com/dolonet/mtg-multi/releases/download/v1.15.0/mtg-multi-1.15.0-linux-arm64.tar.gz"
    arm64.sha256 = "7ae64e4cdddaa1438720e422e39216ad4f8d3fc4cd7bb52e724b79dd8ca3f7ce"

    # Lets the YunoHost autoupdate bot open a PR for every new upstream release
    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^mtg-multi-.*-linux-amd64\\.tar\\.gz$"
    autoupdate.asset.arm64 = "^mtg-multi-.*-linux-arm64\\.tar\\.gz$"
